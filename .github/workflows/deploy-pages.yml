name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            nav-rail/package-lock.json
            agents/package-lock.json
            entry/package-lock.json
            evo-entry/package-lock.json
            agents-table/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix nav-rail
          npm ci --prefix agents
          npm ci --prefix entry
          npm ci --prefix evo-entry
          npm ci --prefix agents-table

      - name: Build site
        run: |
          VITE_BASE_PATH=/exp/nav-rail/ npm run build --prefix nav-rail
          VITE_BASE_PATH=/exp/agents/ npm run build --prefix agents
          npm run build --prefix entry -- --base=/exp/entry/
          npm run build --prefix evo-entry -- --base=/exp/evo-entry/
          npm run build --prefix agents-table -- --base=/exp/agents-table/

      - name: Prepare Pages artifact
        run: |
          mkdir -p public/nav-rail public/icy-sphere public/agents public/counter public/entry public/evo-entry public/agents-table
          cp -R nav-rail/dist/. public/nav-rail/
          cp -R icy-sphere/. public/icy-sphere/
          cp -R agents/dist/. public/agents/
          cp -R counter/. public/counter/
          cp -R entry/dist/. public/entry/
          cp -R evo-entry/dist/. public/evo-entry/
          cp -R agents-table/dist/. public/agents-table/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
